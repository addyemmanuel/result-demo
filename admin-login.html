<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | CS Dept.</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
    <!-- Fluid Animated Background -->
    <div class="bg-animation">
        <div class="bg-blob blob1"></div>
        <div class="bg-blob blob2"></div>
        <div class="bg-blob blob3"></div>
    </div>

    <!-- Centered Login Square -->
    <section class="login-section">
        <div class="login-card-wrapper">
            <div class="login-card">
                <div class="login-header">
                    <div class="login-icon"><i class="fas fa-user-shield"></i></div>
                    <h2>Admin Access</h2>
                    <p>Enter your credentials to manage the department</p>
                </div>

                <form id="login-form">
                    <div class="form-group">
                        <label for="email"><i class="fas fa-envelope"></i> Email</label>
                        <input type="email" id="email" placeholder=" email is admin@tgpa.edu" required />
                    </div>
                    <div class="form-group">
                        <label for="password"><i class="fas fa-lock"></i> Password</label>
                        <input type="password" id="password" placeholder="••••••••" required />
                    </div>
                    <div id="login-error" class="error-message" style="display:none;"></div>
                    <button type="submit" class="btn-primary btn-block" id="login-btn">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </button>
                </form>

                <div class="login-footer">
                    <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Student Portal</a>
                </div>
            </div>
        </div>
    </section>

    <!-- ===== SCRIPTS: Order is important ===== -->
    <!-- 1. Supabase library (real) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <!-- 3. Supabase client initialisation (sets appSupabase) -->
    <script src="js/supabase.js"></script>
    <!-- 4. Auth logic -->
    <script src="js/auth.js"></script>
</body>
</html>
