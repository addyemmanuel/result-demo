[build]
    command = "node scripts/generate-config.js"
    publish = "."

# Ensure SPA-style routing works (optional but useful)
[[redirects]]
    from = "/admin"
    to = "/admin.html"
    status = 200

[[redirects]]
    from = "/result"
    to = "/result.html"
    status = 200

# Security headers
[[headers]]
    for = "/*"
    [headers.values]
        X-Frame-Options = "DENY"
        X-Content-Type-Options = "nosniff"
        Referrer-Policy = "strict-origin-when-cross-origin"